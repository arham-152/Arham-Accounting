<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-app.png" />
    <link rel="apple-touch-icon" href="/logo-app.png" />
    <title>Account</title>
    <script>
      // Protection for the read-only 'fetch' property in AI Studio/Sandboxed environments
      (function() {
        if (typeof window.fetch === 'function') {
          const originalFetch = window.fetch;
          try {
            if (Object.getOwnPropertyDescriptor(window, 'fetch')?.configurable !== false) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return originalFetch; },
                set: function(v) { 
                  console.warn("System Intercept: Attempt to overwrite 'fetch' blocked.");
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {
            console.debug("Fetch lock not required for this environment.");
          }
        }
      })();

      // Global error handler to catch boot crashes
      window.addEventListener('error', function(event) {
        const loader = document.getElementById('static-loader');
        if (!loader) return;
        
        let errorMsg = event.message || 'System Initialization Failure';
        const url = event.filename || (event.target && event.target.src) || '';
        
        // Handle script load failures (404s)
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          const src = event.target.src || event.target.href;
          if (src && (src.includes('.tsx') || src.includes('/src/'))) {
            showBootError('DEPLOYMENT ERROR: You uploaded SOURCE code tags. Please run "npm run build" and upload the contents of the "dist" folder.');
            return;
          }
          showBootError('RESOURCE ERROR: Failed to load ' + (src ? src.split('/').pop() : 'required asset') + '. Check your internet or deployment folder.');
          return;
        }

        if (url && url.endsWith('.tsx')) {
          showBootError('DEPLOYMENT ERROR: You are running .tsx source code in the browser. You must run "npm run build" and deploy the "dist" folder.');
        } else if (errorMsg && (errorMsg.includes('Unexpected token') || errorMsg.includes('syntax error'))) {
          showBootError('RUNTIME ERROR: Possible Syntax Mismatch. This usually happens when uploading source files instead of built files.');
        } else {
          showBootError(errorMsg);
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        showBootError('PROMISE ERROR: ' + (event.reason ? event.reason.message || event.reason : 'Async Failure'));
      });

      function showBootError(msg) {
        const loader = document.getElementById('static-loader');
        if (!loader) return;
        loader.style.backgroundColor = '#0f172a';
        const text = loader.querySelector('.static-text');
        if (text) {
          text.innerHTML = '<div style="color: #ef4444; font-weight: 800; margin-bottom: 12px; letter-spacing: 0;">' + msg + '</div>' + 
                           '<div style="font-size: 9px; line-height: 1.4; color: #94a3b8; margin-bottom: 20px; text-transform: none; letter-spacing: 0;">' + 
                           'Follow the instructions in DEPLOYMENT.md to fix this. Usually this means you uploaded the whole folder instead of just <b>dist</b>.' + 
                           '</div>' +
                           '<div style="display: flex; gap: 10px; justify-content: center;">' +
                           '<button onclick="localStorage.clear(); location.reload();" style="background:#f0b429; color:black; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; font-family: sans-serif;">RESTART</button>' +
                           '<button onclick="alert(\'Detailed Error:\\n\' + msg + \'\\n\\nURL: \' + window.location.href + \'\\nEnvironment: \' + navigator.userAgent)" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; font-family: sans-serif;">DIAGNOSTICS</button>' +
                           '</div>';
          text.style.letterSpacing = '0';
        }
      }

      // Failsafe: If app doesn't mount in 2s, show troubleshooting options
      setTimeout(() => {
        const loader = document.getElementById('static-loader');
        if (loader && loader.style.display !== 'none') {
          const text = loader.querySelector('.static-text');
          if (text && !text.innerHTML.includes('RESTART') && !text.innerHTML.includes('ERROR')) {
            const scripts = Array.from(document.scripts);
            const hasTsx = scripts.some(s => s.src && s.src.includes('.tsx'));
            const mainScript = scripts.find(s => s.type === 'module')?.src || 'Not found';
            
            let statusMsg = hasTsx ? '<span style="color:#ef4444; font-weight:bold;">SOURCE CODE (.tsx) UPLOADED</span>' : 'Checking bundle...';
            
            text.innerHTML = '<div style="margin-bottom: 12px; font-size: 14px; font-weight:600;">Deployment Verification</div>' + 
                             '<div style="margin-bottom: 20px; text-transform: none; font-size: 10px; color: #94a3b8; line-height: 1.5;">' + 
                             statusMsg + '<br>' +
                             'Main Script: ' + (mainScript.split('/').pop() || 'None') + '<br>' +
                             '<div style="margin-top: 8px; color: #facc15;">Ensure you uploaded ONLY the <b>dist</b> folder contents.</div></div>' +
                             '<div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">' +
                             '<button onclick="location.reload()" style="background:#334155; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 11px;">RETRY</button>' +
                             '<button onclick="localStorage.clear(); location.reload();" style="background:#f0b429; color:black; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 11px;">RESET</button>' +
                             '<button onclick="alert(\'CRITICAL DIAGNOSTICS:\\n- Host: \' + window.location.hostname + \'\\n- Main Script: \' + \'' + mainScript + '\' + \'\\n- TSX Detected: \' + ' + hasTsx + ')" style="background:#475569; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 11px;">DIAGNOSTICS</button>' +
                             '</div>';
          }
        }
      }, 2000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Static Splash Screen - shown instantly while JS loads -->
      <style>
        body { margin: 0; padding: 0; background-color: #0a0c10; }
        #static-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background-color: #0a0c10;
          color: #64748b;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          z-index: 9999;
        }
        .static-logo {
          height: 128px;
          width: auto;
          object-fit: contain;
          image-rendering: -webkit-optimize-contrast;
        }
        .static-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid #1f2430;
          border-top: 4px solid #f0b429;
          border-radius: 50%;
          animation: static-spin 1s linear infinite;
        }
        @keyframes static-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .static-text {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 4px;
          color: #64748b;
        }
      </style>
      <div id="static-loader">
        <img src="/logo-dark.png" class="static-logo" alt="Account">
        <div class="static-spinner"></div>
        <div class="static-text">Initializing Systems...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
