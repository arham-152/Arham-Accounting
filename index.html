<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-app.png" />
    <link rel="apple-touch-icon" href="/logo-app.png" />
    <title>Account</title>
    <script>
      // Protection for the read-only 'fetch' property in AI Studio/Sandboxed environments
      (function() {
        if (typeof window.fetch === 'function') {
          const originalFetch = window.fetch;
          try {
            // Attempt to define safety property. 
            // In some hardened environments, this will throw, so we wrap it.
            if (Object.getOwnPropertyDescriptor(window, 'fetch')?.configurable !== false) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return originalFetch; },
                set: function(v) { 
                  console.warn("System Intercept: Attempt to overwrite 'fetch' blocked.");
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {
            console.debug("Fetch lock not required for this environment.");
          }
        }
      })();

      // Global error handler to catch boot crashes
      window.onerror = function(msg, url, line, col, error) {
        const loader = document.getElementById('static-loader');
        if (loader) {
          loader.style.backgroundColor = '#1a0505';
          const text = loader.querySelector('.static-text');
          if (text) {
            text.innerHTML = 'BOOT ERROR: ' + (msg || 'Unknown failure') + '<br><br><button onclick="localStorage.clear(); location.reload();" style="background:#f0b429; color:black; border:none; padding:8px 16px; border-radius:4px; font-weight:bold; cursor:pointer;">FORCE RESTART</button>';
            text.style.color = '#ef4444';
            text.style.letterSpacing = '0';
          }
        }
      };

      // Failsafe: If app doesn't mount in 12s, show escape hatch
      setTimeout(() => {
        const loader = document.getElementById('static-loader');
        if (loader && loader.style.display !== 'none') {
          const text = loader.querySelector('.static-text');
          if (text && !text.innerHTML.includes('RESTART')) {
            text.innerHTML = 'Load taking longer than expected...<br><br><button onclick="location.reload()" style="background:#334155; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer;">RETRY LOAD</button>';
          }
        }
      }, 12000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Static Splash Screen - shown instantly while JS loads -->
      <style>
        body { margin: 0; padding: 0; background-color: #0a0c10; }
        #static-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background-color: #0a0c10;
          color: #64748b;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          z-index: 9999;
        }
        .static-logo {
          height: 128px;
          width: auto;
          object-fit: contain;
          image-rendering: -webkit-optimize-contrast;
        }
        .static-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid #1f2430;
          border-top: 4px solid #f0b429;
          border-radius: 50%;
          animation: static-spin 1s linear infinite;
        }
        @keyframes static-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .static-text {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 4px;
          color: #64748b;
        }
      </style>
      <div id="static-loader">
        <img src="/logo-dark.png" class="static-logo" alt="Account">
        <div class="static-spinner"></div>
        <div class="static-text">Initializing Systems...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
