<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-app.png" />
    <link rel="apple-touch-icon" href="/logo-app.png" />
    <title>Account</title>
    <script>
      (function() {
        // 1. Fetch protection (Immediate)
        var _fetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return window.__m || _fetch; },
            set: function(v) { window.__m = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.debug("Fetch lock active");
        }

        // 2. Storage protection
        try {
          localStorage.setItem('i', '1');
          localStorage.removeItem('i');
        } catch (e) {
          var _s = {};
          var mock = {
            getItem: function(k) { return _s[k] || null; },
            setItem: function(k, v) { _s[k] = String(v); },
            removeItem: function(k) { delete _s[k]; },
            clear: function() { _s = {}; },
            key: function(i) { return Object.keys(_s)[i] || null; },
            get length() { return Object.keys(_s).length; }
          };
          try {
            window.localStorage = mock;
          } catch (err) {
            Object.assign(window.localStorage, mock);
          }
        }
      })();

      // 3. App boot monitor
      window.onerror = function(msg) {
        var loader = document.getElementById('static-loader');
        if (loader) {
          loader.innerHTML = '<div style="background:#1a0505; color:#ef4444; padding:40px; text-align:center; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif;">' +
            '<h2 style="margin:0 0 10px 0; font-size:24px;">SYSTEM HALTED</h2>' +
            '<div style="font-size:10px; color:#94a3b8; margin-bottom:20px; max-width:300px; line-height:1.5;">' + msg + '</div>' +
            '<button onclick="localStorage.clear(); location.reload();" style="background:#f0b429; color:black; border:none; padding:12px 24px; border-radius:8px; font-weight:bold; cursor:pointer;">FIX & RESTART</button>' +
          '</div>';
        }
      };

      setTimeout(function() {
        if (document.getElementById('static-loader')) {
          var scripts = Array.from(document.scripts);
          for(var i=0; i<scripts.length; i++) {
            if (scripts[i].src && scripts[i].src.indexOf('.tsx') !== -1) {
              window.onerror("ERROR: You uploaded SOURCE code (.tsx) to the server. Please run 'npm run build' and upload the 'dist' folder content.");
            }
          }
        }
      }, 5000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Static Splash Screen - shown instantly while JS loads -->
      <style>
        body { margin: 0; padding: 0; background-color: #0a0c10; }
        #static-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background-color: #0a0c10;
          color: #64748b;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          z-index: 9999;
        }
        .static-logo {
          height: 128px;
          width: auto;
          object-fit: contain;
          image-rendering: -webkit-optimize-contrast;
        }
        .static-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid #1f2430;
          border-top: 4px solid #f0b429;
          border-radius: 50%;
          animation: static-spin 1s linear infinite;
        }
        @keyframes static-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .static-text {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 4px;
          color: #64748b;
        }
      </style>
      <div id="static-loader">
        <img src="/logo-dark.png" class="static-logo" alt="Account">
        <div class="static-spinner"></div>
        <div class="static-text">Initializing Systems...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
